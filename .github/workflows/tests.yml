name: 测试

on:
  push:
    branches: [master]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 注意：package-lock.json 被 .gitignore 忽略，用 npm install 而非 npm ci
      - name: 安装测试依赖
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: 运行引擎测试
        working-directory: tests
        run: npm test